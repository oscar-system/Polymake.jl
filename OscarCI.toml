title = "metadata for oscar CI run"

[env]
os = [ ["Linux","RPTU","normal-memory"] ]
julia-version = [ "1.10"]
# branches = [ "release", "<matching>" ]

[pkgs]
  [pkgs.Oscar]
  test = true

  [pkgs.Polymake]
  branches = []
  test = true

[include]
  [include.113]
  Oscar = "<matching>"
  Polymake = ""
  julia-version = "1.13"
  os = ["Linux","RPTU","normal-memory"]

  [include.nightly114]
  Oscar = "<matching>"
  Polymake = ""
  julia-version = "1.14-nightly"
  os = ["Linux","RPTU","normal-memory"]

  [include.nightly]
  Oscar = "<matching>"
  Polymake = ""
  julia-version = "nightly"
  os = ["Linux","RPTU","normal-memory"]

  [include.maclts]
  Oscar = "<matching>"
  Polymake = ""
  julia-version = "1.10"
  os = "macos-15"

  [include.macstable]
  Oscar = "<matching>"
  Polymake = ""
  julia-version = "1"
  os = "macos-15"
